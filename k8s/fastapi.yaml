apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENV: "dev"
  DB: "postgresql"
  DB_USER: "postgres"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      initContainers:
      - name: run-migrations
        image: raft-fastapi:latest
        imagePullPolicy: Never
        command: ["alembic", "-x", "ENV=dev", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
      containers:
      - name: fastapi
        image: raft-fastapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  selector:
    app: fastapi-app
  ports:
  - port: 80
    targetPort: 8000
  type: NodePort